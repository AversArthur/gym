# /etc/nginx/sites-available/gym.arturavers.com
# После копирования: ln -s ../sites-available/gym.arturavers.com /etc/nginx/sites-enabled/
# HTTPS добавит certbot: certbot --nginx -d gym.arturavers.com
server {
    listen 80;
    server_name gym.arturavers.com;

    # Экспорт и пачки офлайн-синхронизации бывают крупными
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker и манифест не кэшируем, иначе обновления приложения застревают
    location ~ ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache";
    }
}
